<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habit Tracker - Shivam</title>

    <link rel="stylesheet" href="habit.css">
</head>

<body>

    <div class="habit-container">

        <h1>🔥 Habit Tracker</h1>

        <p class="subtitle">Build better habits every day</p>

        <!-- ADD HABIT -->
        <div class="input-box">
            <input
                type="text"
                id="habitInput"
                placeholder="Enter a new habit..."
            >

            <button onclick="addHabit()">Add Habit</button>
        </div>

        <!-- PROGRESS -->
        <div class="progress-box">
            <p id="progressText">Completed: 0 / 0</p>
        </div>

        <!-- HABIT LIST -->
        <ul id="habitList"></ul>

        <!-- BACK BUTTON -->
        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

    </div>

    <script src="habit.js"></script>

</body>

</html>
