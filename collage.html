<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
        }

        h1 {
            color: cyan;
            margin-top: 50px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 50px 20px;
        }

        .card {
            width: 260px;
            padding: 25px;
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
        }

        .card h2 {
            color: cyan;
        }

        button {
            background: cyan;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>🎓 My College Dashboard</h1>

    <div class="container">

        <div class="card">
            <h2>Course</h2>
            <p>B.Tech CSE (AI)</p>
        </div>

        <div class="card">
            <h2>Current Year</h2>
            <p>2nd Year</p>
        </div>

        <div class="card">
            <h2>Current Semester</h2>
            <p>3rd Semester</p>
        </div>

        <div class="card">
            <h2>🧾 Fee Receipt</h2>
            <p>My college fee receipts</p>
            <button>View Receipts</button>
        </div>

        <div class="card">
            <h2>📊 Results</h2>
            <p>My semester results</p>
            <button>View Results</button>
        </div>

    </div>

    <a href="index.html">
        <button>← Back to Home</button>
    </a>

</body>
</html>
