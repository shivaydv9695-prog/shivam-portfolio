<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My College - Shivam</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
        }

        h1 {
            color: cyan;
            margin-top: 50px;
        }

        .college-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 50px;
        }

        .college-card {
            background: #111;
            border: 1px solid #333;
            padding: 30px;
            width: 250px;
            border-radius: 15px;
        }

        .college-card h2 {
            color: cyan;
        }

        button {
            background: cyan;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>My College Dashboard</h1>

    <div class="college-container">

        <div class="college-card">
            <h2>🎓 Current Year</h2>
            <p>B.Tech CSE (AI)</p>
            <p>1st Year</p>
        </div>

        <div class="college-card">
            <h2>🧾 Fee Receipt</h2>
            <p>View my college fee receipt</p>
            <button>View Receipt</button>
        </div>

        <div class="college-card">
            <h2>📊 Semester Result</h2>
            <p>View semester results</p>
            <button>View Result</button>
        </div>

    </div>

    <br><br>

    <a href="index.html">
        <button>← Back to Home</button>
    </a>

</body>
</html>
